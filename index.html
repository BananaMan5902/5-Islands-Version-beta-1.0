<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Islands</title>
<style>

html,body{height:100%;margin:0;background:#0b2a44;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
canvas{display:block}
.p{position:fixed;background:var(--panel);border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.5}
#hud{left:12px;top:calc(12px + env(safe-area-inset-top,0px));min-width:210px}
#mini{right:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:6px}
#help{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;max-width:60vw}

#shop{left:50%;top:50%;transform:translate(-50%,-50%);display:none;width:min(560px,92vw);max-height:84vh;overflow:auto;padding:16px 20px}
#shop h2{margin:0 0 4px;color:var(--gold)} #shop h3{margin:14px 0 4px;font-size:15px;color:var(--gold)}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.12)}
button{font:inherit;background:var(--gold);color:#241707;border:0;border-radius:6px;padding:4px 12px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;margin:2px 0 6px}
#hp{height:100%;background:#58b368;width:100%}
</style></head><body>
<div id="hud" class="p"></div>
<div id="mini" class="p"><canvas id="mc" width="150" height="150"></canvas></div>
<div id="help" class="p">Click the game to capture the mouse · WASD walk the deck · F at the wheel to steer with WASD · F at a cannon, look to aim, click or Space fires every cannon · 1–3 ammo · E market when docked · G ashore or back aboard</div>
<div id="xh"></div><div id="msg" class="p"></div>
<div id="shop" class="p"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

{n:"Silk Bay",x:-280,z:280,r:24,p:"Silk",v:80,c:0x8e44ad},{n:"Gold Rock",x:280,z:280,r:24,p:"Gold",v:110,c:0xf1c40f}];

function tex(k,rep){const cv=document.createElement("canvas");cv.width=cv.height=128;const x=cv.getContext("2d"),q=Math.random;x.fillStyle=k=="sea"?"#c8d8e0":"#fff";x.fillRect(0,0,128,128);
 if(k=="wood"){x.fillStyle="rgba(60,30,10,.35)";for(let i=0;i<8;i++)x.fillRect(0,i*16,128,2);for(let i=0;i<60;i++){x.fillStyle="rgba(70,40,15,"+(.1+q()*.2)+")";x.fillRect(q()*128,q()*128,8+q()*30,1)}for(let i=0;i<8;i++){x.fillStyle="rgba(50,25,10,.4)";x.fillRect(q()*128,i*16,2,16)}}
 else if(k=="cloth"){x.fillStyle="rgba(0,0,0,.1)";for(let i=0;i<128;i+=4){x.fillRect(i,0,1,128);x.fillRect(0,i,128,1)}}

 else{for(let i=0;i<700;i++){x.fillStyle="rgba(0,0,0,"+(.05+q()*.12)+")";x.fillRect(q()*128,q()*128,1+q()*3,1+q()*3)}}

function makeShip(t,hull,sail=0xf4efe0){const k=SH[t],g=new THREE.Group(),z=1+k.cn*.06,L=10*z,W=3.8*z;
 g.add(box(W,1.6,L,hull,0,.8,0));g.add(box(W*.6,1.6,L*.22,hull,0,.8,L*.6));
 g.add(cyl(.25,.3,10*z,0x4a3220,0,5*z,0,6));g.add(box(W*1.5,5*z,.2,sail,0,6.5*z,0));
 g.cn=[];g.L=L;g.W=W;const wh=new THREE.Mesh(new THREE.TorusGeometry(.8,.12,6,14),mat(0x4a3220));wh.position.set(0,2.6,-L*.42);g.add(wh);g.add(box(.3,1.8,.3,0x4a3220,0,1.9,-L*.42));const rows=Math.ceil(k.cn/2);

  const c=cyl(.28,.34,1.4,0x1a1a1a,sd*W/2,1.8,zz,8);c.rotation.z=Math.PI/2;g.add(c);g.cn.push(c)}

const EN=[],PR=[],FX=[],RESP=[];
const barG=new THREE.PlaneGeometry(6,.7);

function spawn(s){s.clear=1;s.taken=0;s.t=0;s.crates.forEach(c=>c.visible=true);
 for(let i=0;i<0;i++){const a=i*2.09+.5,x=s.x+Math.sin(a)*s.r*.55,z=s.z+Math.cos(a)*s.r*.55,m=new THREE.Group();
  m.add(cyl(2,2.5,5,0x777777,0,6.5,0));m.add(cyl(2.7,2.7,1,0x333333,0,9.2,0));const c=cyl(.4,.5,2.4,0x111111,0,9.9,1.4,8);c.rotation.x=Math.PI/2;m.add(c);
  m.position.set(x,0,z);sc.add(m);const e={k:"fort",x,z,hp:70,max:70,cd:2+Math.random()*3,isl:s,m,rad:4,dmg:10,rng:60};mkBar(e);EN.push(e)}
 for(let i=0;i<4;i++)spawnShip(s)}
function spawnShip(s){if(EN.filter(x=>x.isl==s&&x.k=="ship").length>=4)return;const m=makeShip("sloop",0x222222,0x111111),a=Math.random()*6.28,e={k:"ship",x:s.x+Math.sin(a)*(s.r+18),z:s.z+Math.cos(a)*(s.r+18),h:0,v:6,hp:55,max:55,cd:2,isl:s,m,rad:5,dmg:6,rng:50,pr:s.r+14+Math.random()*30};m.scale.setScalar(.85);sc.add(m);mkBar(e);EN.push(e)}
ISL.forEach((s,i)=>{s.i=i;const g=new THREE.Group();g.position.set(s.x,0,s.z);
 g.add(cyl(s.r*.82,s.r,3,0xe3cf96,0,1,0,28));g.add(cyl(s.r*.62,s.r*.82,2,s.shop?0x6aa84f:0x4f7f3a,0,3,0,28));
 if(s.shop){g.add(box(9,5,9,0xcaa56a,0,6.5,0));g.add(cyl(0,7,3.5,0xa33a2a,0,11.5,0,4));g.add(box(5,3,5,0xb8935a,-8,5.5,6));g.add(cyl(.2,.2,9,0x4a3220,7,8.5,-5,6));g.add(box(3,1.6,.2,0xe9b44c,8.5,12,-5));
  for(let k=0;k<3;k++)g.add(box(1.6,1.6,1.6,0x8a5a2b,4+k*2,4.8,7))}
 else{for(let k=0;k<6;k++){const a=k*1.05,d=s.r*(.35+.2*(k%2));g.add(cyl(0,1.8,5,0x2d6a2d,Math.sin(a)*d,6,Math.cos(a)*d,6))}
  s.crates=[];for(let k=0;k<4;k++){const a=k*1.57+.7,c=box(2.2,2.2,2.2,s.c,s.x+Math.sin(a)*s.r*.25,4.6,s.z+Math.cos(a)*s.r*.25);c.position.set(Math.sin(a)*s.r*.25,4.6,Math.cos(a)*s.r*.25);g.add(c);s.crates.push(c)}}
 sc.add(g);if(!s.shop)spawn(s)});
const ring=new THREE.Mesh(new THREE.RingGeometry(2.6,3.2,32),new THREE.MeshBasicMaterial({color:0xffd24a,side:THREE.DoubleSide,transparent:true,opacity:.9}));ring.rotation.x=-Math.PI/2;ring.position.y=.2;sc.add(ring);
const K={},ndc=new THREE.Vector2(),ray=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),aim={x:0,z:20},MAXR=75;
const bg=new THREE.SphereGeometry(.25,8,8);
function shoot(f,to,own,dmg,r,col){const T=1.2,g=30;const m=new THREE.Mesh(bg,mat(col));m.position.copy(f);sc.add(m);
 PR.push({m,vx:(to.x-f.x)/T,vz:(to.z-f.z)/T,vy:-f.y/T+.5*g*T,own,dmg,r})}
function splash(p,r,col){const m=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.7}));m.position.set(p.x,.5,p.z);m.scale.setScalar(r*.4);sc.add(m);FX.push({m,t:0,r})}
function kill(e){e.dead=1;sc.remove(e.bar);if(e.k=="ship"){sc.remove(e.m);if(e.fac!="navy")RESP.push({s:e.isl,t:12})}else{e.m.scale.y=.3;}
 EN.splice(EN.indexOf(e),1);const s=e.isl;if(e.k=="fort"&&!EN.some(x=>x.isl==s&&x.k=="fort")){s.clear=1;P.gold+=50;msg(s.n+" is free of pirates (+50g). Sail close to claim the "+s.p+".")}}
function nearest(e,fac,r){let b=null,bd=r;for(const o of EN)if(o.k=="ship"&&(o.fac||"pirate")==fac){const d=Math.hypot(o.x-e.x,o.z-e.z);if(d<bd){bd=d;b=o}}return b}
function spawnNavy(){for(let i=0;i<2;i++){const sd=Math.random()<.5?-1:1,x=sd*440,z=(Math.random()-.5)*600+i*30,m=makeShip("brig",0x24407a),e={k:"ship",fac:"navy",x,z,h:Math.atan2(-x,-z),v:6,spd:7,hp:160,max:160,cd:2+i,m,rad:6,dmg:9,rng:60,life:80};sc.add(m);mkBar(e);e.bar.material.color.set(0x4aa3ff);EN.push(e)}msg("A Navy squadron has arrived to hunt pirates.")}
function pickWp(){if(Math.random()<.3)return{x:(Math.random()-.5)*900,z:(Math.random()-.5)*900};const s=ISL[Math.floor(Math.random()*5)],a=Math.random()*6.28,r=s.r+22+Math.random()*40;return{x:s.x+Math.sin(a)*r,z:s.z+Math.cos(a)*r}}
function landing(){if(P.mode=="land"){if(Math.hypot(P.wx-P.x,P.wz-P.z)<16){P.mode="walk";P.lx=0;P.lz=-1;P.yaw=P.h+Math.PI;msg("Back aboard.")}else msg("Your ship is too far away. Walk back to the shore.");return}
 if(P.mode!="walk")return;const s=ISL.find(s=>Math.hypot(P.x-s.x,P.z-s.z)<s.r+12);if(!s){msg("Sail right up to an island, then press G to go ashore.");return}
 const dx=P.x-s.x,dz=P.z-s.z,d=Math.hypot(dx,dz)||1;P.wx=s.x+dx/d*s.r*.75;P.wz=s.z+dz/d*s.r*.75;P.isl=s;P.mode="land";P.v=0;msg(s.shop?"Ashore at the market. Press G near your ship to board.":"Ashore. Walk to the crates in the middle of the island.")}
function interact(){if(P.mode=="land")return;if(P.mode!="walk"){P.mode="walk";return}const m=P.mesh;
 if(Math.hypot(P.lx,P.lz+m.L*.42)<3){P.mode="helm";P.lx=0;P.lz=-m.L*.42+1.3;msg("At the helm: W/S sail, A/D turn. F to step away.");return}
 if(m.cn.some(c=>Math.hypot(P.lx-c.position.x,P.lz-c.position.z)<3)){P.mode="gun";msg("Manning the cannons: look to aim, click to fire them all. F to step away.");return}
 msg("Stand beside the wheel at the stern or next to a cannon, then press F.")}
function fire(){if(P.open||P.cd>0)return;if(P.mode!="gun"){msg("Walk to a cannon and press F to man the guns.");return}const k=SH[P.type],b=AM[P.sel],n=Math.min(k.cn,P.ammo[P.sel]);
 if(n<1){msg("Out of "+b.n+"s. Press 1–3 to switch or buy more at the market.");return}
 P.ammo[P.sel]-=n;P.cd=2.2;P.mesh.updateMatrixWorld(true);
 for(let i=0;i<n;i++){const f=new THREE.Vector3();P.mesh.cn[i].getWorldPosition(f);const a=Math.random()*6.28,q=Math.random()*3;
  shoot(f,{x:aim.x+Math.cos(a)*q,z:aim.z+Math.sin(a)*q},"p",b.dmg,b.r,b.col)}}
R.domElement.addEventListener("mousedown",e=>{if(document.pointerLockElement!=R.domElement){if(!P.open)R.domElement.requestPointerLock();return}if(e.button==0)fire()});
addEventListener("mousemove",e=>{if(document.pointerLockElement==R.domElement){P.yaw-=e.movementX*.0025;P.pit=Math.max(-1.3,Math.min(1.3,P.pit-e.movementY*.0025))}});
addEventListener("keydown",e=>{K[e.code]=1;if(e.code=="Space"){e.preventDefault();fire()}
 const n={Digit1:"iron",Digit2:"heavy",Digit3:"fire"}[e.code];if(n&&P.ammo[n]>0)P.sel=n;
 if(e.code=="KeyG"&&!P.open)landing();if(e.code=="KeyF"&&!P.open)interact();if(e.code=="KeyE"||e.code=="Escape"){if(P.open||(e.code=="KeyE"&&docked())){P.open=!P.open;if(P.open)document.exitPointerLock();renderShop()}}});
addEventListener("keyup",e=>K[e.code]=0);
addEventListener("resize",()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
const docked=()=>Math.hypot(P.x,P.z)<36;
let mt=0;function msg(t){const m=$("msg");m.textContent=t;m.style.display="block";mt=5}
function renderShop(){const el=$("shop");if(!P.open){el.style.display="none";return}
 let h=`<h2>Harbor Market</h2><div>Gold: ${P.gold}</div><h3>Ships</h3>`;
 for(const t in SH){const k=SH[t];h+=`<div class=r><span>${k.n}: hull ${k.hp}, ${k.cn} cannons, speed ${k.spd}</span>`+(t==P.type?"<b>Current</b>":P.owned[t]?`<button data-a="eq:${t}">Equip</button>`:`<button data-a="bs:${t}">Buy ${k.cost}g</button>`)+"</div>"}
 h+="<h3>Cannonballs (pack of 20)</h3>";
 for(const t in AM){h+=`<div class=r><span>${AM[t].n}: ${AM[t].dmg} damage, blast ${AM[t].r}. You have ${P.ammo[t]}</span><button data-a="ba:${t}">Buy ${AM[t].cost*20}g</button></div>`}

$("shop").addEventListener("click",e=>{const a=e.target.dataset.a;if(!a)return;const[c,t]=a.split(":");

const mc=$("mc").getContext("2d");

let last=performance.now(),T=0;
